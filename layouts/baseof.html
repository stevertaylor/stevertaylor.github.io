<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}" class="no-js">
<head>
  {{- partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-page{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{- partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- $js := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{- block "scripts" . }}{{ end }}
</body>
</html>
