{{- /* The Hellings–Downs figure with a caption: {{< hd-curve >}} */ -}}
<figure class="hd-figure hd-inline reveal">
  {{- partial "art/hd-curve.html" . }}
  <figcaption>
    The Hellings–Downs curve: the correlation an isotropic gravitational-wave background induces between the
    timing residuals of two pulsars, as a function of their angular separation on the sky. Its shape distinguishes a
    background from clock errors (a monopole) and solar-system ephemeris errors (a dipole).
  </figcaption>
</figure>
