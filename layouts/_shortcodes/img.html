<figure class="figure">
  {{- partial "img.html" (dict "src" (.Get "src") "alt" (.Get "alt") "widths" (slice 720 1100 1440) "sizes" "(min-width: 800px) 720px, 100vw") }}
  {{- with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
