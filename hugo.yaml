baseURL: "https://stevertaylor.github.io/"
locale: "en-us"
title: "Stephen R. Taylor"
enableRobotsTXT: true

# No blog taxonomies or feeds: this is a small static site.
disableKinds: [taxonomy, term, rss]
outputs:
  home: [html]
  page: [html]

# Make the images in static/images available to Hugo's image processing
# (responsive WebP versions) while keeping their original public URLs.
module:
  mounts:
    - source: assets
      target: assets
    - source: static/images
      target: assets/images
    - source: static
      target: static

markup:
  goldmark:
    parser:
      attribute:
        block: true        # allows {.lead} after a paragraph
  tableOfContents:
    startLevel: 2
    endLevel: 2
    ordered: false

minify:
  disableXML: true
  minifyOutput: true

params:
  description: "Gravitational-wave astrophysicist and Associate Professor of Physics & Astronomy at Vanderbilt University. Chair of the NANOGrav Collaboration, member of the ESA–NASA LISA Science Team, and Director of VIPER."
  author: "Stephen R. Taylor"
  role: "Associate Professor of Physics & Astronomy"
  institution: "Vanderbilt University"
  images: ["images/og-card.jpg"]   # default social-preview image

  # Contact: shown in the footer of every page (the "Contact" menu item jumps there).
  email: "stephen.r.taylor@vanderbilt.edu"
  address:
    - "Department of Physics & Astronomy"
    - "Vanderbilt University"
    - "Nashville, TN 37235, USA"

  cv:
    url: "/cv.pdf"
    updated: "January 2026"
    pages: 25

  profiles:
    - name: "Google Scholar"
      url: "https://scholar.google.com/citations?user=iN2djBMAAAAJ&hl=en"
    - name: "NASA ADS"
      url: "https://ui.adsabs.harvard.edu/search/filter_author_facet_hier_fq_author=NOT&filter_author_facet_hier_fq_author=(*%3A*%20NOT%20author_facet_hier%3A%221%2FTaylor%2C%20S%2FTaylor%2C%20Stephen%22%20NOT%20author_facet_hier%3A%221%2FTaylor%2C%20S%2FTaylor%2C%20S%20%20Ross%22)&filter_author_facet_hier_fq_author=author_facet_hier%3A%221%2FTaylor%2C%20S%2FTaylor%2C%20S%22&fq=%7B!type%3Daqp%20v%3D%24fq_database%7D&fq=%7B!type%3Daqp%20v%3D%24fq_author%7D&fq_author=((*%3A*%20NOT%20author_facet_hier%3A%221%2FTaylor%2C%20S%2FTaylor%2C%20Stephen%22%20NOT%20author_facet_hier%3A%221%2FTaylor%2C%20S%2FTaylor%2C%20S%20%20Ross%22)%20NOT%20author_facet_hier%3A%221%2FTaylor%2C%20S%2FTaylor%2C%20S%22)&fq_database=(database%3Aastronomy%20OR%20database%3Aphysics)&q=%20author%3A%22taylor%2C%20stephen%20r.%22&sort=date%20desc%2C%20bibcode%20desc&p_=0"
